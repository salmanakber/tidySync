  location /admin {
    proxy_pass http://tidysync_admin;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/graphql {
    proxy_pass http://tidysync_api/graphql;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /api/upload {
    proxy_pass http://tidysync_api/upload;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    client_max_body_size 500M;
  }

  location /api/auth {
    proxy_pass http://tidysync_api/auth;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /graphql {
    proxy_pass http://tidysync_api/graphql;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }

  location /auth {
    proxy_pass http://tidysync_api/auth;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /upload {
    proxy_pass http://tidysync_api/upload;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    client_max_body_size 500M;
  }

  location /download {
    proxy_pass http://tidysync_api/download;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header x-tidysync-shop $http_x_tidysync_shop;
  }

  location /jobs/ {
    proxy_pass http://tidysync_api/jobs/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header x-tidysync-shop $http_x_tidysync_shop;
    proxy_buffering off;
  }

  location /v1/ {
    proxy_pass http://tidysync_api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
  }

  location /mcp/ {
    proxy_pass http://tidysync_api/mcp/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /internal/ {
    proxy_pass http://tidysync_api/internal/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /health {
    proxy_pass http://tidysync_api/health;
  }

  location / {
    proxy_pass http://tidysync_embedded;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
