upstream tidysync_embedded {
  server tidysync:3000;
}

upstream tidysync_admin {
  server tidysync:3001;
}

upstream tidysync_api {
  server tidysync:4000;
}

# HTTP — redirect to HTTPS when TLS certs exist (see tidysync-ssl.conf)
server {
  listen 80;
  server_name sync.tidyflowapp.com;

  client_max_body_size 500M;

  include /etc/nginx/snippets/tidysync-locations.conf;
}
