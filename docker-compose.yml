services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tidysync
      POSTGRES_PASSWORD: tidysync
      POSTGRES_DB: tidysync
    ports:
      - "5432:5432"
    volumes:
      - tidysync_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tidysync_redis:/data

volumes:
  tidysync_pgdata:
  tidysync_redis:
