# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "TidySync"
client_id = "7f901f6015cfa897c7767b0b78cd40d5"
application_url = "https://sync.tidyflowapp.com"
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_inventory,write_inventory,read_locations,read_customers,write_customers,read_orders,read_discounts,write_discounts,read_metafields,write_metafields"

[auth]
redirect_urls = [
  "https://sync.tidyflowapp.com/auth/callback"
]

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "/webhooks/shopify"

  [[webhooks.subscriptions]]
  topics = ["app_purchases_one_time/update"]
  uri = "/webhooks/shopify"

[pos]
embedded = false
